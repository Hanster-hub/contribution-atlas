name: Collect public snapshot
# Intentionally manual: add a schedule only after reviewing your config and
# publication audience. This workflow DOES NOT deploy or commit snapshots.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contribution-atlas-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect configured public repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh.py --full
      - name: Upload snapshot (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: contribution-snapshot
          path: public/data.json
          retention-days: 7
